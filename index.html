<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack -- 3D Creator</title>

    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        kanit: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0C0C0C',
                        accentText: '#D7E2EA',
                    }
                }
            }
        };
    </script>

    <!-- React 18 & Babel CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #root {
            background-color: #0C0C0C;
            font-family: 'Kanit', sans-serif;
            color: #D7E2EA;
            overflow-x: clip;
            width: 100%;
        }

        /* Gradient Text */
        .hero-heading {
            background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Contact Button Gradient & Inset Shadow */
        .contact-btn {
            background: linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%);
            box-shadow: 0px 4px 4px rgba(181, 1, 167, 0.25), 4px 4px 12px #7721B1 inset;
            outline: 2px solid white;
            outline-offset: -3px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0C0C0C;
        }

        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #383838;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- REUSABLE COMPONENTS ---

        // Contact Button
        const ContactButton = ({ className = "" }) => {
            return (
                <a
                    href="#contact"
                    className={`contact-btn inline-flex items-center justify-center rounded-full text-white font-medium uppercase tracking-widest transition-transform duration-300 hover:scale-105 active:scale-95 px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 text-xs sm:text-sm md:text-base cursor-pointer ${className}`}
                >
                    Contact Me
                </a>
            );
        };

        // Live Project Ghost Button
        const LiveProjectButton = ({ href = "#" }) => {
            return (
                <a
                    href={href}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="rounded-full border-2 border-[#D7E2EA] text-[#D7E2EA] font-medium uppercase tracking-widest px-6 py-2 sm:px-8 sm:py-3 text-xs sm:text-sm md:text-base hover:bg-[#D7E2EA]/10 transition-all duration-200 inline-block text-center whitespace-nowrap cursor-pointer"
                >
                    Live Project
                </a>
            );
        };

        // FadeIn Component with Intersection Observer
        const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const domRef = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { rootMargin: "50px", threshold: 0 }
                );

                if (domRef.current) observer.observe(domRef.current);
                return () => observer.disconnect();
            }, []);

            const style = {
                opacity: isVisible ? 1 : 0,
                transform: isVisible ? "translate3d(0, 0, 0)" : `translate3d(${x}px, ${y}px, 0)`,
                transition: `opacity ${duration}s cubic-bezier(0.25, 0.1, 0.25, 1) ${delay}s, transform ${duration}s cubic-bezier(0.25, 0.1, 0.25, 1) ${delay}s`,
                willChange: "opacity, transform",
            };

            return (
                <div ref={domRef} style={style} className={className}>
                    {children}
                </div>
            );
        };

        // Magnet Effect Component
        const Magnet = ({
            children,
            padding = 150,
            strength = 3,
            activeTransition = "transform 0.3s ease-out",
            inactiveTransition = "transform 0.6s ease-in-out",
            className = ""
        }) => {
            const magnetRef = useRef(null);
            const [pos, setPos] = useState({ x: 0, y: 0 });
            const [isActive, setIsActive] = useState(false);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!magnetRef.current) return;
                    const rect = magnetRef.current.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    const distanceX = e.clientX - centerX;
                    const distanceY = e.clientY - centerY;
                    const distance = Math.hypot(distanceX, distanceY);
                    const maxDistance = Math.max(rect.width, rect.height) / 2 + padding;

                    if (distance < maxDistance) {
                        setIsActive(true);
                        setPos({
                            x: distanceX / strength,
                            y: distanceY / strength,
                        });
                    } else if (isActive) {
                        setIsActive(false);
                        setPos({ x: 0, y: 0 });
                    }
                };

                window.addEventListener("mousemove", handleMouseMove, { passive: true });
                return () => window.removeEventListener("mousemove", handleMouseMove);
            }, [isActive, padding, strength]);

            return (
                <div
                    ref={magnetRef}
                    className={className}
                    style={{
                        transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`,
                        transition: isActive ? activeTransition : inactiveTransition,
                        willChange: "transform",
                    }}
                >
                    {children}
                </div>
            );
        };

        // Character-by-Character Scroll-Driven Text Reveal
        const AnimatedText = ({ text }) => {
            const containerRef = useRef(null);
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                const handleScroll = () => {
                    if (!containerRef.current) return;
                    const rect = containerRef.current.getBoundingClientRect();
                    const windowHeight = window.innerHeight;

                    const start = windowHeight * 0.8;
                    const end = windowHeight * 0.2;

                    const currentProgress = (start - rect.top) / (start - end);
                    setProgress(Math.min(Math.max(currentProgress, 0), 1));
                };

                window.addEventListener("scroll", handleScroll, { passive: true });
                handleScroll();
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            const chars = text.split("");

            return (
                <p
                    ref={containerRef}
                    className="text-[#D7E2EA] font-medium text-center leading-relaxed max-w-[560px] text-[clamp(1rem,2vw,1.35rem)] flex flex-wrap justify-center select-none"
                >
                    {chars.map((char, index) => {
                        const charStart = (index / chars.length) * 0.8;
                        const charEnd = charStart + (1 / chars.length) * 1.5;
                        let opacity = 0.2;
                        if (progress >= charEnd) {
                            opacity = 1;
                        } else if (progress > charStart) {
                            opacity = 0.2 + 0.8 * ((progress - charStart) / (charEnd - charStart));
                        }

                        return (
                            <span
                                key={index}
                                style={{ opacity, transition: "opacity 0.15s ease" }}
                                className="inline-block"
                            >
                                {char === " " ? "\u00A0" : char}
                            </span>
                        );
                    })}
                </p>
            );
        };

        // --- 1. HERO SECTION ---
        const HeroSection = () => {
            return (
                <section className="relative h-screen w-full flex flex-col justify-between overflow-x-clip px-6 md:px-10 pb-7 sm:pb-8 md:pb-10 pt-6 md:pt-8 bg-[#0C0C0C]">
                    {/* Navbar */}
                    <FadeIn delay={0} y={-20} className="w-full z-20">
                        <nav className="flex justify-between items-center w-full">
                            {["About", "Price", "Projects", "Contact"].map((item) => (
                                <a
                                    key={item}
                                    href={`#${item.toLowerCase()}`}
                                    className="text-[#D7E2EA] font-medium uppercase tracking-wider text-sm md:text-lg lg:text-[1.4rem] hover:opacity-70 transition-opacity duration-200"
                                >
                                    {item}
                                </a>
                            ))}
                        </nav>
                    </FadeIn>

                    {/* Hero Heading */}
                    <div className="w-full overflow-hidden z-0">
                        <FadeIn delay={0.15} y={40} className="w-full text-center">
                            <h1 className="hero-heading font-black uppercase tracking-tight leading-none whitespace-nowrap w-full text-[14vw] sm:text-[15vw] md:text-[16vw] lg:text-[17.5vw] mt-6 sm:mt-4 md:-mt-5 select-none">
                                Hi, i’m jack
                            </h1>
                        </FadeIn>
                    </div>

                    {/* Hero Portrait with Magnet effect */}
                    <div className="absolute left-1/2 -translate-x-1/2 z-10 w-[280px] sm:w-[360px] md:w-[440px] lg:w-[520px] top-1/2 -translate-y-1/2 sm:top-auto sm:translate-y-0 sm:bottom-0 pointer-events-auto">
                        <FadeIn delay={0.6} y={30}>
                            <Magnet padding={150} strength={3}>
                                <img
                                    src="https://shrug-person-78902957.figma.site/_components/v2/d24c01ad3a56fc65e942a1f501eb73db42d7cf9a/Rectangle_40443.81459862.png"
                                    alt="Jack Portrait"
                                    className="w-full h-auto object-contain pointer-events-none drop-shadow-2xl"
                                    loading="eager"
                                />
                            </Magnet>
                        </FadeIn>
                    </div>

                    {/* Bottom Bar */}
                    <div className="flex justify-between items-end w-full z-20">
                        <FadeIn delay={0.35} y={20}>
                            <p className="text-[#D7E2EA] font-light uppercase tracking-wide leading-snug text-[clamp(0.75rem,1.4vw,1.5rem)] max-w-[160px] sm:max-w-[220px] md:max-w-[260px]">
                                a 3d creator driven by crafting striking and unforgettable projects
                            </p>
                        </FadeIn>

                        <FadeIn delay={0.5} y={20}>
                            <ContactButton />
                        </FadeIn>
                    </div>
                </section>
            );
        };

        // --- 2. MARQUEE SECTION ---
        const MARQUEE_IMAGES = [
            "https://motionsites.ai/assets/hero-space-voyage-preview-eECLH3Yc.gif",
            "https://motionsites.ai/assets/hero-codenest-preview-Cgppc2qV.gif",
            "https://motionsites.ai/assets/hero-vex-ventures-preview-BczMFIiw.gif",
            "https://motionsites.ai/assets/hero-stellar-ai-v2-preview-DjvxjG3C.gif",
            "https://motionsites.ai/assets/hero-asme-preview-B_nGDnTP.gif",
            "https://motionsites.ai/assets/hero-transform-data-preview-Cx5OU29N.gif",
            "https://motionsites.ai/assets/hero-vitara-preview-Cjz2QYyU.gif",
            "https://motionsites.ai/assets/hero-terra-preview-BFjrCr7T.gif",
            "https://motionsites.ai/assets/hero-skyelite-preview-DHaZIgUv.gif",
            "https://motionsites.ai/assets/hero-aethera-preview-DknSlcTa.gif",
            "https://motionsites.ai/assets/hero-designpro-preview-D8c5_een.gif",
            "https://motionsites.ai/assets/hero-stellar-ai-preview-D3HL6bw1.gif",
            "https://motionsites.ai/assets/hero-xportfolio-preview-D4A8maiC.gif",
            "https://motionsites.ai/assets/hero-orbit-web3-preview-BXt4OttD.gif",
            "https://motionsites.ai/assets/hero-nexora-preview-cx5HmUgo.gif",
            "https://motionsites.ai/assets/hero-evr-ventures-preview-DZxeVFEX.gif",
            "https://motionsites.ai/assets/hero-planet-orbit-preview-DWAP8Z1P.gif",
            "https://motionsites.ai/assets/hero-new-era-preview-CocuDUm9.gif",
            "https://motionsites.ai/assets/hero-wealth-preview-B70idl_u.gif",
            "https://motionsites.ai/assets/hero-luminex-preview-CxOP7ce6.gif",
            "https://motionsites.ai/assets/hero-celestia-preview-0yO3jXO8.gif",
        ];

        const MarqueeSection = () => {
            const sectionRef = useRef(null);
            const [scrollOffset, setScrollOffset] = useState(0);

            const row1Images = MARQUEE_IMAGES.slice(0, 11);
            const row2Images = MARQUEE_IMAGES.slice(11);

            const row1 = [...row1Images, ...row1Images, ...row1Images];
            const row2 = [...row2Images, ...row2Images, ...row2Images];

            useEffect(() => {
                let ticking = false;
                const handleScroll = () => {
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            if (sectionRef.current) {
                                const rect = sectionRef.current.getBoundingClientRect();
                                const sectionTop = rect.top + window.scrollY;
                                const offset = (window.scrollY - sectionTop + window.innerHeight) * 0.3;
                                setScrollOffset(offset);
                            }
                            ticking = false;
                        });
                        ticking = true;
                    }
                };

                window.addEventListener("scroll", handleScroll, { passive: true });
                handleScroll();
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            return (
                <section
                    ref={sectionRef}
                    className="bg-[#0C0C0C] pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden flex flex-col gap-3 select-none"
                >
                    {/* Row 1: Moves RIGHT */}
                    <div
                        className="flex gap-3 will-change-transform"
                        style={{
                            transform: `translateX(${scrollOffset - 200}px)`,
                        }}
                    >
                        {row1.map((src, i) => (
                            <div
                                key={`r1-${i}`}
                                className="w-[420px] h-[270px] min-w-[420px] rounded-2xl overflow-hidden bg-neutral-900 border border-white/5 flex-shrink-0"
                            >
                                <img
                                    src={src}
                                    alt={`Showcase ${i}`}
                                    loading="lazy"
                                    className="w-full h-full object-cover"
                                />
                            </div>
                        ))}
                    </div>

                    {/* Row 2: Moves LEFT */}
                    <div
                        className="flex gap-3 will-change-transform"
                        style={{
                            transform: `translateX(${-(scrollOffset - 200)}px)`,
                        }}
                    >
                        {row2.map((src, i) => (
                            <div
                                key={`r2-${i}`}
                                className="w-[420px] h-[270px] min-w-[420px] rounded-2xl overflow-hidden bg-neutral-900 border border-white/5 flex-shrink-0"
                            >
                                <img
                                    src={src}
                                    alt={`Showcase ${i}`}
                                    loading="lazy"
                                    className="w-full h-full object-cover"
                                />
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        // --- 3. ABOUT SECTION ---
        const AboutSection = () => {
            return (
                <section
                    id="about"
                    className="relative min-h-screen w-full flex flex-col items-center justify-center text-center px-5 sm:px-8 md:px-10 py-20 bg-[#0C0C0C] overflow-hidden"
                >
                    {/* Top-left: Moon icon */}
                    <div className="absolute top-[4%] left-[1%] sm:left-[2%] md:left-[4%] pointer-events-none z-0">
                        <FadeIn delay={0.1} x={-80} y={0} duration={0.9}>
                            <img
                                src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png"
                                alt="Moon Icon"
                                className="w-[120px] sm:w-[160px] md:w-[210px] object-contain"
                                loading="lazy"
                            />
                        </FadeIn>
                    </div>

                    {/* Bottom-left: 3D object */}
                    <div className="absolute bottom-[8%] left-[3%] sm:left-[6%] md:left-[10%] pointer-events-none z-0">
                        <FadeIn delay={0.25} x={-80} y={0} duration={0.9}>
                            <img
                                src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png"
                                alt="3D Shape"
                                className="w-[100px] sm:w-[140px] md:w-[180px] object-contain"
                                loading="lazy"
                            />
                        </FadeIn>
                    </div>

                    {/* Top-right: Lego icon */}
                    <div className="absolute top-[4%] right-[1%] sm:right-[2%] md:right-[4%] pointer-events-none z-0">
                        <FadeIn delay={0.15} x={80} y={0} duration={0.9}>
                            <img
                                src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png"
                                alt="Lego Icon"
                                className="w-[120px] sm:w-[160px] md:w-[210px] object-contain"
                                loading="lazy"
                            />
                        </FadeIn>
                    </div>

                    {/* Bottom-right: 3D group */}
                    <div className="absolute bottom-[8%] right-[3%] sm:right-[6%] md:right-[10%] pointer-events-none z-0">
                        <FadeIn delay={0.3} x={80} y={0} duration={0.9}>
                            <img
                                src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png"
                                alt="Group 3D Elements"
                                className="w-[130px] sm:w-[170px] md:w-[220px] object-contain"
                                loading="lazy"
                            />
                        </FadeIn>
                    </div>

                    {/* Centered Content */}
                    <div className="relative z-10 flex flex-col items-center justify-center max-w-4xl mx-auto">
                        <FadeIn delay={0} y={40}>
                            <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-[clamp(3rem,12vw,160px)] text-center mb-10 sm:mb-14 md:mb-16">
                                About me
                            </h2>
                        </FadeIn>

                        <div className="mb-16 sm:mb-20 md:mb-24 flex justify-center w-full">
                            <AnimatedText
                                text="With more than five years of experience in design, i focus on branding, web design, and user experience, i truly enjoy working with businesses that aim to stand out and present their best image. Let's build something incredible together!"
                            />
                        </div>

                        <FadeIn delay={0.2} y={20}>
                            <ContactButton />
                        </FadeIn>
                    </div>
                </section>
            );
        };

        // --- 4. SERVICES SECTION ---
        const SERVICES_DATA = [
            {
                num: "01",
                name: "3D Modeling",
                desc: "Creation of detailed objects, characters, or environments tailored to specific client needs, ideal for games, products, and visualizations.",
            },
            {
                num: "02",
                name: "Rendering",
                desc: "High-quality, photorealistic renders that showcase designs with custom lighting, textures, and materials to bring concepts to life.",
            },
            {
                num: "03",
                name: "Motion Design",
                desc: "Dynamic animations and motion graphics that add energy and storytelling to brands, products, and digital experiences.",
            },
            {
                num: "04",
                name: "Branding",
                desc: "Crafting cohesive visual identities -- from logos to full brand systems -- that communicate a clear and memorable presence.",
            },
            {
                num: "05",
                name: "Web Design",
                desc: "Designing clean, modern, and conversion-focused websites with attention to layout, typography, and user experience.",
            },
        ];

        const ServicesSection = () => {
            return (
                <section
                    id="price"
                    className="bg-[#FFFFFF] text-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32 w-full"
                >
                    <div className="max-w-5xl mx-auto">
                        <FadeIn y={40}>
                            <h2 className="text-[#0C0C0C] font-black uppercase text-center text-[clamp(3rem,12vw,160px)] leading-none mb-16 sm:mb-20 md:mb-28">
                                Services
                            </h2>
                        </FadeIn>

                        <div className="flex flex-col">
                            {SERVICES_DATA.map((item, index) => (
                                <FadeIn key={item.num} delay={index * 0.1} y={30}>
                                    <div className="flex flex-col md:flex-row md:items-center justify-between border-t border-[rgba(12,12,12,0.15)] py-8 sm:py-10 md:py-12 gap-4 md:gap-8">
                                        <span className="font-black text-[#0C0C0C] text-[clamp(3rem,10vw,140px)] leading-none select-none tracking-tight">
                                            {item.num}
                                        </span>

                                        <div className="flex flex-col gap-2 md:w-3/5">
                                            <h3 className="text-[#0C0C0C] font-medium uppercase text-[clamp(1rem,2.2vw,2.1rem)] tracking-tight">
                                                {item.name}
                                            </h3>
                                            <p className="text-[#0C0C0C] font-light leading-relaxed max-w-2xl text-[clamp(0.85rem,1.6vw,1.25rem)] opacity-60">
                                                {item.desc}
                                            </p>
                                        </div>
                                    </div>
                                </FadeIn>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // --- 5. PROJECTS SECTION ---
        const PROJECTS_DATA = [
            {
                num: "01",
                title: "Nextlevel Studio",
                category: "Client",
                link: "#",
                col1Top: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055344_5eff02e0-87a5-41ce-b64f-eb08da8f33db.png&w=1280&q=85",
                col1Bottom: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055431_11d841fd-8b41-46a5-82e4-b04f2407a7d8.png&w=1280&q=85",
                col2Tall: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055451_e317bf2d-28d4-48cc-86b0-6f72f25b6327.png&w=1280&q=85",
            },
            {
                num: "02",
                title: "Aura Brand Identity",
                category: "Personal",
                link: "#",
                col1Top: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055654_911201c5-36d9-4bc6-bac7-331adfce159f.png&w=1280&q=85",
                col1Bottom: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055723_5ceda0b8-d9c2-4665-b2e3-83ba19ba76d1.png&w=1280&q=85",
                col2Tall: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055753_adc5dcbd-a8e6-49c0-b43a-9b030d835cea.png&w=1280&q=85",
            },
            {
                num: "03",
                title: "Solaris Digital",
                category: "Client",
                link: "#",
                col1Top: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055759_963cfb0b-4bd1-4b0f-9d0a-09bd6cf95b2f.png&w=1280&q=85",
                col1Bottom: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_060108_438f781a-9846-4dcc-89ab-c4e6cb830f5b.png&w=1280&q=85",
                col2Tall: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055818_9d062121-ad7e-46b9-999a-1a6a692ef1ee.png&w=1280&q=85",
            },
        ];

        const ProjectCard = ({ project, index, totalCards }) => {
            const cardRef = useRef(null);
            const [scale, setScale] = useState(1);

            useEffect(() => {
                const handleScroll = () => {
                    if (!cardRef.current) return;
                    const rect = cardRef.current.getBoundingClientRect();
                    const targetScale = 1 - (totalCards - 1 - index) * 0.03;

                    if (rect.top <= index * 28 + 96) {
                        const progress = Math.min(Math.max((index * 28 + 96 - rect.top) / 400, 0), 1);
                        setScale(1 - (1 - targetScale) * progress);
                    } else {
                        setScale(1);
                    }
                };

                window.addEventListener("scroll", handleScroll, { passive: true });
                handleScroll();
                return () => window.removeEventListener("scroll", handleScroll);
            }, [index, totalCards]);

            return (
                <div
                    ref={cardRef}
                    className="h-[85vh] sticky flex items-start justify-center"
                    style={{ top: `${index * 28 + 96}px` }}
                >
                    <div
                        style={{
                            transform: `scale(${scale})`,
                            transformOrigin: "top center",
                            transition: "transform 0.1s ease-out",
                        }}
                        className="w-full max-w-6xl rounded-[40px] sm:rounded-[50px] md:rounded-[60px] border-2 border-[#D7E2EA] bg-[#0C0C0C] p-4 sm:p-6 md:p-8 flex flex-col justify-between shadow-[0_20px_50px_rgba(0,0,0,0.8)]"
                    >
                        {/* Top Row */}
                        <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-[#D7E2EA]/15">
                            <div className="flex items-center gap-4 sm:gap-6">
                                <span className="font-black text-3xl sm:text-4xl md:text-5xl text-[#D7E2EA] leading-none">
                                    {project.num}
                                </span>
                                <span className="text-[#D7E2EA]/70 font-light uppercase tracking-widest text-xs sm:text-sm border border-[#D7E2EA]/30 rounded-full px-3 py-1">
                                    {project.category}
                                </span>
                                <h3 className="text-[#D7E2EA] font-medium uppercase text-base sm:text-xl md:text-2xl tracking-wide">
                                    {project.title}
                                </h3>
                            </div>

                            <LiveProjectButton href={project.link} />
                        </div>

                        {/* Bottom Row */}
                        <div className="grid grid-cols-1 md:grid-cols-10 gap-4 sm:gap-6 pt-4">
                            <div className="md:col-span-4 flex flex-col gap-4">
                                <img
                                    src={project.col1Top}
                                    alt={`${project.title} 1`}
                                    className="w-full h-[clamp(130px,16vw,230px)] object-cover rounded-[30px] sm:rounded-[40px] md:rounded-[50px] border border-white/5"
                                    loading="lazy"
                                />
                                <img
                                    src={project.col1Bottom}
                                    alt={`${project.title} 2`}
                                    className="w-full h-[clamp(160px,22vw,340px)] object-cover rounded-[30px] sm:rounded-[40px] md:rounded-[50px] border border-white/5"
                                    loading="lazy"
                                />
                            </div>

                            <div className="md:col-span-6 h-full">
                                <img
                                    src={project.col2Tall}
                                    alt={`${project.title} Full`}
                                    className="w-full h-full min-h-[260px] md:min-h-[460px] object-cover rounded-[30px] sm:rounded-[40px] md:rounded-[50px] border border-white/5"
                                    loading="lazy"
                                />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ProjectsSection = () => {
            return (
                <section
                    id="projects"
                    className="bg-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] -mt-10 sm:-mt-12 md:-mt-14 relative z-10 px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32"
                >
                    <div className="max-w-6xl mx-auto">
                        <FadeIn y={40}>
                            <h2 className="hero-heading font-black uppercase text-center text-[clamp(3rem,12vw,160px)] leading-none mb-16 sm:mb-20 md:mb-28">
                                Project
                            </h2>
                        </FadeIn>

                        <div className="relative flex flex-col gap-10 pb-32">
                            {PROJECTS_DATA.map((proj, idx) => (
                                <ProjectCard
                                    key={proj.num}
                                    project={proj}
                                    index={idx}
                                    totalCards={PROJECTS_DATA.length}
                                />
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // --- FOOTER SECTION ---
        const FooterSection = () => {
            return (
                <footer id="contact" className="bg-[#0C0C0C] border-t border-white/10 px-6 md:px-10 py-12 flex flex-col md:flex-row items-center justify-between gap-6">
                    <div className="flex flex-col items-center md:items-start">
                        <span className="hero-heading font-black uppercase text-2xl tracking-wider">Jack</span>
                        <p className="text-xs text-[#D7E2EA]/50 uppercase tracking-widest mt-1">
                            3D Creator & Visual Designer
                        </p>
                    </div>

                    <p className="text-xs text-[#D7E2EA]/40 uppercase tracking-widest text-center">
                        &copy; {new Date().getFullYear()} Jack. All rights reserved.
                    </p>

                    <ContactButton className="scale-90" />
                </footer>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            return (
                <div className="bg-[#0C0C0C] text-[#D7E2EA] font-kanit overflow-x-clip min-h-screen">
                    <HeroSection />
                    <MarqueeSection />
                    <AboutSection />
                    <ServicesSection />
                    <ProjectsSection />
                    <FooterSection />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
